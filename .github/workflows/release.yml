name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  create-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag_name: ${{ steps.set-tag.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Create draft release
        id: set-tag
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          gh release view "$TAG_NAME" > /dev/null 2>&1 || gh release create "$TAG_NAME" --draft --title "$TAG_NAME" --generate-notes
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"

  build-android:
    needs: create-release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAG_NAME: ${{ needs.create-release.outputs.tag_name }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PATH: clipshift-release-key.jks
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set Gradle JDK
        run: echo "GRADLE_OPTS=-Dorg.gradle.java.home=$JAVA_HOME" >> $GITHUB_ENV
      - uses: arduino/setup-task@v2

      - name: Clone Android repo
        run: |
          git clone --depth 1 https://codeberg.org/clipshift/android.git
          cd android
          git fetch --depth 1 origin tag "$TAG_NAME" 2>/dev/null || true
          if git checkout "$TAG_NAME" 2>/dev/null; then
            echo "Checked out tag $TAG_NAME"
          else
            echo "::warning::Tag $TAG_NAME not found in android repo, falling back to main"
            git checkout main
          fi

      - name: Install Android build-tools
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;36.1.0"

      - name: Decode keystore
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/clipshift-release-key.jks

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Build debug APK
        working-directory: android
        run: task build

      - name: Build release APK
        working-directory: android
        run: task build:release:ci SDK_PATH="$ANDROID_HOME/build-tools/36.1.0"

      - name: Upload APKs
        working-directory: android
        run: |
          gh release upload "$TAG_NAME" app/build/outputs/apk/debug/app-debug.apk --name clipshift-debug.apk --repo "$GITHUB_REPOSITORY" --clobber
          gh release upload "$TAG_NAME" app/build/outputs/apk/release/clipshift.apk --repo "$GITHUB_REPOSITORY" --clobber

  build-macos:
    needs: create-release
    runs-on: macos-14
    timeout-minutes: 60
    env:
      TAG_NAME: ${{ needs.create-release.outputs.tag_name }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: arduino/setup-task@v2

      - name: Clone desktop repo
        run: |
          git clone --depth 1 https://codeberg.org/clipshift/desktop.git
          cd desktop
          git fetch --depth 1 origin tag "$TAG_NAME" 2>/dev/null || true
          if git checkout "$TAG_NAME" 2>/dev/null; then
            echo "Checked out tag $TAG_NAME"
          else
            echo "::warning::Tag $TAG_NAME not found in desktop repo, falling back to main"
            git checkout main
          fi

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-macos-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: cargo-macos-

      - name: Build macOS DMG
        working-directory: desktop
        run: task build:macos

      - name: Upload DMG
        working-directory: desktop
        run: gh release upload "$TAG_NAME" src-tauri/target/release/bundle/dmg/*.dmg --repo "$GITHUB_REPOSITORY" --clobber

  build-linux:
    needs: create-release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TAG_NAME: ${{ needs.create-release.outputs.tag_name }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: arduino/setup-task@v2

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Clone desktop repo
        run: |
          git clone --depth 1 https://codeberg.org/clipshift/desktop.git
          cd desktop
          git fetch --depth 1 origin tag "$TAG_NAME" 2>/dev/null || true
          if git checkout "$TAG_NAME" 2>/dev/null; then
            echo "Checked out tag $TAG_NAME"
          else
            echo "::warning::Tag $TAG_NAME not found in desktop repo, falling back to main"
            git checkout main
          fi

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-linux-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: cargo-linux-

      - name: Build Linux AppImage
        working-directory: desktop
        run: task build:linux:native

      - name: Upload AppImage
        working-directory: desktop
        run: gh release upload "$TAG_NAME" src-tauri/target/release/bundle/appimage/*.AppImage --repo "$GITHUB_REPOSITORY" --clobber

  build-windows:
    needs: create-release
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      TAG_NAME: ${{ needs.create-release.outputs.tag_name }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: arduino/setup-task@v2

      - name: Clone desktop repo
        shell: bash
        run: |
          git clone --depth 1 https://codeberg.org/clipshift/desktop.git
          cd desktop
          git fetch --depth 1 origin tag "$TAG_NAME" 2>/dev/null || true
          if git checkout "$TAG_NAME" 2>/dev/null; then
            echo "Checked out tag $TAG_NAME"
          else
            echo "::warning::Tag $TAG_NAME not found in desktop repo, falling back to main"
            git checkout main
          fi

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-windows-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: cargo-windows-

      - name: Build Windows NSIS
        working-directory: desktop
        shell: bash
        run: task build:windows:native

      - name: Upload Windows artifacts
        working-directory: desktop
        shell: bash
        run: |
          gh release upload "$TAG_NAME" src-tauri/target/release/bundle/nsis/*.exe --repo "$GITHUB_REPOSITORY" --clobber
          gh release upload "$TAG_NAME" src-tauri/target/release/clipshift-desktop.exe --repo "$GITHUB_REPOSITORY" --clobber
